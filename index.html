<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Level English Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar - 13 ta mashq ro'yxati -->
        <aside class="sidebar">
            <h2>Mashqlar</h2>
            <ul id="exercise-list">
                <li onclick="loadExercise(1)">1-mashq</li>
                <li onclick="loadExercise(2)">2-mashq</li>
                <li onclick="loadExercise(3)">3-mashq</li>
                <li onclick="loadExercise(4)">4-mashq</li>
                <li onclick="loadExercise(5)">5-mashq</li>
                <li onclick="loadExercise(6)">6-mashq</li>
                <li onclick="loadExercise(7)">7-mashq</li>
                <li onclick="loadExercise(8)">8-mashq</li>
                <li onclick="loadExercise(9)">9-mashq</li>
                <li onclick="loadExercise(10)">10-mashq</li>
                <li onclick="loadExercise(11)">11-mashq</li>
                <li onclick="loadExercise(12)">12-mashq</li>
                <li onclick="loadExercise(13)">13-mashq</li>
            </ul>
        </aside>

        <!-- Asosiy kontent qismi -->
        <main class="content-area">
            <h2 id="exercise-title">Mashqni tanlang</h2>
            <div id="exercise-passage" class="passage">
                Matn bu yerda chiqadi...
            </div>

            <div class="translation-selection-actions">
                 <button id="translate-selection" class="btn-secondary" type="button" disabled>Notanish so'zlarni belgilang</button>
                 <button id="clear-selection" class="btn-secondary" type="button" disabled>Belgilarni tozalash</button>
            </div>

            <div id="translation-editor" class="translation-editor" hidden>
                <label id="translation-label" for="translation-input">Tarjima</label>
                <input id="translation-input" type="text" autocomplete="off" placeholder="O'zbekcha tarjimani yozing">
                <button id="translation-save" class="btn-success" type="button">Saqlash</button>
                <button id="translation-cancel" class="btn-secondary" type="button">Bekor qilish</button>
            </div>
            
            <div id="exercise-questions" class="questions-section">
                <!-- Savollar dinamik yuklanadi -->
            </div>

            <div class="action-buttons">
                <button id="check-btn" class="btn-success" onclick="checkAnswers()">Javoblarni tekshirish</button>
                <button id="reset-btn" class="btn-secondary" onclick="resetExercise()">Qaytadan boshlash</button>
            </div>

            <div id="result-box" class="result-box" style="display: none;"></div>
        </main>
    </div>

    <!-- Skriptlar -->
    <script src="exercises.js"></script>
    <script src="script.js"></script>
</body>
</html>
